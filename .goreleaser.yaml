version: 2
project_name: kvx
builds:
  - main: ./cmd/kvx
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/iamludal/kvx/internal/cli.version={{.Version}}
      - -X github.com/iamludal/kvx/internal/cli.commit={{.ShortCommit}}
      - -X github.com/iamludal/kvx/internal/cli.date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# release-please creates the GitHub release and writes its notes from
# CHANGELOG.md; goreleaser only uploads the artifacts to it.
release:
  mode: keep-existing
  prerelease: auto
changelog:
  disable: true
dockers_v2:
  - images: [ghcr.io/iamludal/kvx]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    labels:
      # Links the ghcr.io package to the repository.
      org.opencontainers.image.source: https://github.com/iamludal/kvx
      org.opencontainers.image.description: Power tools for Vault and OpenBao KV secrets
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
homebrew_casks:
  - repository:
      owner: iamludal
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/iamludal/kvx
    description: Power tools for Vault and OpenBao KV secrets
    license: MIT
    # The binary is not signed or notarized: without this, macOS Gatekeeper
    # may refuse to run it ("kvx is damaged and can't be opened").
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kvx"]
          end
