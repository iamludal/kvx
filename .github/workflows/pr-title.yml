name: 🏷️ PR title

# Pull requests are squash-merged and their title becomes the commit on main,
# which release-please reads to pick the next version. So the title must be a
# Conventional Commit: "feat: ...", "fix(cp): ...", "feat!: ..." for breaking.
#
# `pull_request` (not `pull_request_target`): the check only reads the title,
# so it never needs secrets or write access, even for pull requests from forks.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: 🏷️ Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🏷️ Check the title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            deps
            refactor
            test
            build
            ci
            chore
            style
          requireScope: false
