name: 🚀 Release

# On every push to main, release-please updates a "chore: release x.y.z" pull
# request (version + CHANGELOG.md) from the Conventional Commits merged since
# the last release. Merging that pull request creates the tag and the GitHub
# release; goreleaser then builds and uploads the binaries, the Docker image
# and the Homebrew cask, in this same workflow.
#
# goreleaser runs here rather than on `push: tags`, because tags created with
# GITHUB_TOKEN do not trigger other workflows.

on:
  push:
    branches: [main]

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: 📝 Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag, GitHub release, CHANGELOG.md on the release branch
      pull-requests: write # open and update the release pull request
      issues: write # labels on the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 📝 release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          # Optional: a token that is not GITHUB_TOKEN lets CI run on the
          # release pull request. Falls back to GITHUB_TOKEN when unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  goreleaser:
    name: 📦 Build and publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release # add required reviewers in repo settings to gate publishing
    permissions:
      contents: write # upload artifacts to the GitHub release
      packages: write # push ghcr.io/iamludal/kvx
      id-token: write # sign build provenance attestations
      attestations: write # store them
    steps:
      - name: 📥 Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # goreleaser needs the tags
          persist-credentials: false
      - name: 🐹 Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # no shared cache in release builds (cache poisoning)
      - name: 🖥️ Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 🔑 Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 📦 GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3 # pinned GoReleaser itself, not only the action
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: 🔏 Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
