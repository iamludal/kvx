version: 2
# Commit messages use Conventional Commit types, so updates land in the right
# changelog section ("deps" is shown, "ci" is hidden).
#
# cooldown: a version is only proposed once it has been public for a few
# days, so a hijacked release is usually caught and yanked before it reaches
# this repository. Security updates are not delayed.
#
# GitHub Actions are pinned by commit SHA with a "# vX.Y.Z" comment;
# Dependabot updates both.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
